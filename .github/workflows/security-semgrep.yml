name: Security - Semgrep

# Solo ejecucion manual: el escaneo automatico de Semgrep vive en
# ci-sec.yml, ci-cd-sec.yml y ci-sec-nightly.yml (junto al Quality Gate).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST con Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Ejecutar Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Publicar reportes de Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14
