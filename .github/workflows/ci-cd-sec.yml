name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  # Optional: also trigger on version tags
  # tags: [ 'v*.*.*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-org/your-app

jobs:
  # ==================================================================
  # CI JOBS - mismos controles que el CI de feature + Quality Gate
  # ==================================================================
  # ------------------------------------------------------------------
  # 1. Build + Unit Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests with coverage
        run: mvn -B clean verify

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. SAST - Semgrep (reglas publicas + reglas del laboratorio)
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. SAST - CodeQL (ademas guarda el SARIF para el Quality Gate)
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: codeql-results

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. SpotBugs + FindSecBugs (configurados en el pom.xml)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # El goal "spotbugs" genera el reporte sin cortar la build: decide el Quality Gate
      - name: Run SpotBugs
        run: mvn -B clean compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Quality Gate: lee los reportes y falla si hay hallazgos criticos
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, sast-codeql, static-analysis]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check previous job results
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Semgrep:      ${{ needs.sast-semgrep.result }}"
          echo "CodeQL:       ${{ needs.sast-codeql.result }}"
          echo "SpotBugs:     ${{ needs.static-analysis.result }}"
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            exit 1
          fi

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Evaluate critical findings
        run: |
          python3 .github/scripts/quality_gate.py \
            --semgrep  reports/semgrep-reports/semgrep-results.json \
            --codeql   reports/codeql-sarif \
            --spotbugs reports/spotbugs-report/spotbugsXml.xml

  # ==================================================================
  # CD JOBS – only on main (or tags)
  # ==================================================================
  docker-build-scan-push:
    name: Docker Build → Scan → Push
    runs-on: ubuntu-latest
    needs: [quality-gate]                  # solo si el Quality Gate aprobo
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write          # needed to push to GHCR
      security-events: write   # for Trivy SARIF upload
      id-token: write          # for optional image signing later

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                    # build first, scan, then push
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'                 # fail the job on CRITICAL/HIGH

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Optional: Deploy to Staging (example with a simple SSH or K8s)
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-scan-push
    if: false #github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.yourapp.com   # optional status check URL

    steps:
      - name: Checkout (for manifests)
        uses: actions/checkout@v4

      # Example 1: Simple SSH + docker compose (good for small teams)
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      #       docker compose -f /opt/app/docker-compose.yml up -d

      # Example 2: Kubernetes with kubectl (more production-like)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          # Update image tag in deployment (simple sed example)
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build-scan-push.outputs.image-digest }}|" k8s/staging/deployment.yaml
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/your-app -n staging --timeout=120s

  # ------------------------------------------------------------------
  # Optional: Production promotion (manual approval)
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: false #github.ref == 'refs/heads/main'
    environment:
      name: production          # requires manual approval in GitHub UI
      url: https://yourapp.com

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig (prod)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production
        run: |
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build-scan-push.outputs.image-digest }}|" k8s/production/deployment.yaml
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/your-app -n production --timeout=180s