name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'  # Runs every day at 20:55
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for Sonar / CodeQL history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # 3. Software Composition Analysis (SCA) - Dependency vulnerabilities
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DnvdApiKey="$NVD_API_KEY" \
              -DsuppressionFile=dependency-check-suppressions.xml || true
        # Remove "|| true" once you have suppressions in place and want hard fails

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Optional: SpotBugs + PMD (static analysis)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs & PMD
        run: |
          mvn -B clean compile \
              com.github.spotbugs:spotbugs-maven-plugin:check \
              org.apache.maven.plugins:maven-pmd-plugin:check || true

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Quality Gate summary (optional - fails the workflow if critical issues)
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, sca-dependency-check]
    if: always()
    steps:
      - name: Check previous job results
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "CodeQL:       ${{ needs.sast-codeql.result }}"
          echo "SCA:          ${{ needs.sca-dependency-check.result }}"

          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "::error::Build or tests failed"
            exit 1
          fi

          if [[ "${{ needs.sast-codeql.result }}" == "failure" ]]; then
            echo "::error::CodeQL found high-severity security issues"
            exit 1
          fi

          echo "Quality gate passed"