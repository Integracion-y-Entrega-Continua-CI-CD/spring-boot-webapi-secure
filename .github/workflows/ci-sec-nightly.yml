name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'  # Runs every day at 20:55
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests with coverage
        run: mvn -B clean verify

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. SAST - Semgrep
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. SAST - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: codeql-results

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. SCA - OWASP Dependency-Check (solo en el nightly: la base NVD es pesada)
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      # La clave se lee de NVD_API_KEY (nvdApiKeyEnvironmentVariable en el pom.xml).
      # failBuildOnCVSS=11: el plugin no corta la build por CVSS, decide el Quality Gate.
      # Sin "|| true": si la herramienta falla, el job falla.
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 5. SpotBugs + FindSecBugs
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs
        run: mvn -B clean compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 6. Quality Gate: lee los reportes (incluido SCA) y falla si hay criticos
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, sast-codeql, sca-dependency-check, static-analysis]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check previous job results
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Semgrep:      ${{ needs.sast-semgrep.result }}"
          echo "CodeQL:       ${{ needs.sast-codeql.result }}"
          echo "SCA:          ${{ needs.sca-dependency-check.result }}"
          echo "SpotBugs:     ${{ needs.static-analysis.result }}"
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            exit 1
          fi

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Evaluate critical findings
        run: |
          python3 .github/scripts/quality_gate.py \
            --semgrep  reports/semgrep-reports/semgrep-results.json \
            --codeql   reports/codeql-sarif \
            --spotbugs reports/spotbugs-report/spotbugsXml.xml \
            --depcheck reports/dependency-check-report/dependency-check-report.json
